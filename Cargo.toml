[package]
name = "flashbots-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
ethers = { version = "2.0", features = ["ws", "openssl", "rustls"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
log = "0.4.28"
